name: agridispatch   # 顶层 name 字段兜底，避免中文目录名导致 project name 为空

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-agridispatch}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-33321}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-agridispatch}-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-36321}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-agridispatch}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-19621}:8080"
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18621}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-50}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-60}
      DB_CONNECT_RETRY_COUNT: ${DB_CONNECT_RETRY_COUNT:-10}
      DB_CONNECT_RETRY_INTERVAL_SECONDS: ${DB_CONNECT_RETRY_INTERVAL_SECONDS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-agridispatch}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18621}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
